name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check (tipos + paridad i18n)
        run: npm run check

      - name: Build
        run: npm run build
        env:
          ASTRO_BASE: ${{ vars.ASTRO_BASE || '/portfolio/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://LiMPbIzK.github.io/portfolio/' }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          SITE_ROLE: ${{ secrets.SITE_ROLE }}
          SITE_BIO: ${{ secrets.SITE_BIO }}
          SITE_OBJECTIVE: ${{ secrets.SITE_OBJECTIVE }}
          SITE_ROLE_EN: ${{ secrets.SITE_ROLE_EN }}
          SITE_BIO_EN: ${{ secrets.SITE_BIO_EN }}
          SITE_OBJECTIVE_EN: ${{ secrets.SITE_OBJECTIVE_EN }}
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_GITHUB_USER: ${{ secrets.SITE_GITHUB_USER }}
          SITE_GITHUB_URL: ${{ secrets.SITE_GITHUB_URL }}
          SITE_LINKEDIN_URL: ${{ secrets.SITE_LINKEDIN_URL }}
          SITE_CV_URL: ${{ secrets.SITE_CV_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
